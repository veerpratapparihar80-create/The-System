    // --- WEB AUDIO SYNTHESIZER ---
    function playSystemSound(type, enabled = true) {
      if (!enabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === "click") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(920, now);
          osc.frequency.exponentialRampToValueAtTime(1480, now + 0.06);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === "levelup") {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.35);
          });
        } else if (type === "arise") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.55);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.6);
        } else if (type === "alarm") {
          [320, 220].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(freq, now + idx * 0.15);
            gain.gain.setValueAtTime(0.1, now + idx * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.14);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.15);
            osc.stop(now + idx * 0.15 + 0.14);
          });
        }
      } catch (e) {}
    }

      useEffect(() => {
        try {

          if (state.googleVault?.bound && state.googleVault?.email) {

        } catch (e) {}
      }, [state]);

      // Pomodoro Dungeon Countdown
      useEffect(() => {
        if (!dungeonRunning) return;
        const interval = setInterval(() => {
          setDungeonSecondsLeft((prev) => {
            if (prev <= 1) {
              clearInterval(interval);
              setDungeonRunning(false);
              gainRewards(500, 2500, "INSTANT DUNGEON BOSS SLAIN!");
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [dungeonRunning]);

      const notify = (msg, type = "info") => {
        playSystemSound(type === "levelup" ? "levelup" : type === "arise" ? "arise" : type === "danger" ? "alarm" : "click", state.ui.soundEnabled);

        setTimeout(() => {

      // Active Color Palette
      const palette = useMemo(() => {
        if (state.penaltyMode) return COLOR_PRESETS.bloodPenalty;
        if (state.ui.useCustomColors) return state.ui.customColors;
        return COLOR_PRESETS[state.ui.preset] || COLOR_PRESETS.classicCyan;

      const maxXpForLevel = Math.floor(
        state.backend.baseXpPerLevel * Math.pow(state.backend.xpGrowthFactor, Math.max(0, state.hunter.level - 1))
      );

      // Universal Customizable System Button Helper
      const getButtonStyle = (variant = "primary") => {
        const baseColor = state.ui.btnUseCustomColor

          ? palette.danger

        } else if (state.ui.btnShape === "capsule") {
          borderRadius = "9999px";
        } else if (state.ui.btnShape === "hex") {
          clipPath = "polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%)";
        }

        let background = `${baseColor}28`;
        let border = `1.5px solid ${baseColor}`;
        if (state.ui.btnShader === "gradient") {
          background = `linear-gradient(135deg, ${baseColor}66, ${palette.secondary}66)`;
        } else if (state.ui.btnShader === "solid") {
          background = baseColor;
        } else if (state.ui.btnShader === "wireframe") {
          background = "transparent";
          border = `1.5px dashed ${baseColor}`;
        } else if (state.ui.btnShader === "ghost") {
          background = "rgba(255,255,255,0.04)";
          border = `1px solid ${baseColor}55`;
        }

        return {
          background,
          border,
          borderRadius,
          clipPath,
          color: state.ui.btnShader === "solid" ? "#020617" : textColor,
          boxShadow: `0 0 ${state.ui.btnGlow}px ${baseColor}44`,
          fontFamily: state.ui.fontFamily,
          cursor: "pointer"
        };
      };

      const getWindowStyle = () => {
        let clipPath = "none";
        let borderStyle = "solid";
        if (state.ui.windowStyle === "angular") {
          clipPath = "polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px))";
        } else if (state.ui.windowStyle === "hex") {
          clipPath = "polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px)";
        } else if (state.ui.windowStyle === "brutal") {

        }

        return {

      // Leveling & Reward Engine
      const gainRewards = (xpDelta, goldDelta, label = "REWARD ACQUIRED") => {
        setState((prev) => {
          let newXp = prev.hunter.xp + xpDelta;
          let newLevel = prev.hunter.level;
          let newAp = prev.hunter.ap;
          let newMaxHp = prev.hunter.maxHp;
          let newMaxMp = prev.hunter.maxMp;
          let leveledUp = false;

          let reqXp = Math.floor(
            prev.backend.baseXpPerLevel * Math.pow(prev.backend.xpGrowthFactor, Math.max(0, newLevel - 1))
          );

          while (newXp >= reqXp) {
            newXp -= reqXp;
            newLevel += 1;
            newAp += prev.backend.apPerLevel;
            newMaxHp += prev.backend.hpPerLevel;
            newMaxMp += prev.backend.mpPerLevel;
            leveledUp = true;
            reqXp = Math.floor(
              prev.backend.baseXpPerLevel * Math.pow(prev.backend.xpGrowthFactor, Math.max(0, newLevel - 1))
            );
          }

          if (leveledUp) {
            setTimeout(() => notify(`LEVEL UP! You reached Level ${newLevel} (+${prev.backend.apPerLevel} AP)`, "levelup"), 50);
          } else {
            setTimeout(() => notify(`${label}: +${xpDelta} XP, +${goldDelta} Gold`, "info"), 50);
          }

          return {
            ...prev,
            hunter: {
              ...prev.hunter,
              level: newLevel,
              xp: newXp,
              gold: prev.hunter.gold + goldDelta,
              ap: newAp,
              maxHp: newMaxHp,
              hp: leveledUp ? newMaxHp : prev.hunter.hp,
              maxMp: newMaxMp,
              mp: leveledUp ? newMaxMp : prev.hunter.mp
            }
          };
        });
      };

      // Stat Handlers
      const allocateStat = (id, delta) => {
        setState((prev) => {
          if (delta > 0 && prev.hunter.ap < delta) {
            notify("Insufficient Ability Points (AP)!", "danger");
            return prev;
          }
          playSystemSound("click", prev.ui.soundEnabled);
          return {
            ...prev,
            hunter: {
              ...prev.hunter,
              ap: prev.hunter.ap - delta,
              stats: prev.hunter.stats.map((s) =>
                s.id === id ? { ...s, val: Math.max(1, s.val + delta) } : s

                    <input
                      type="text"
                      value={state.hunter.name}
                      onChange={(e) => setState((prev) => ({ ...prev, hunter: { ...prev.hunter, name: e.target.value } }))}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Job / Class</label>
                    <input
                      type="text"
                      value={state.hunter.job}
                      onChange={(e) => setState((prev) => ({ ...prev, hunter: { ...prev.hunter, job: e.target.value } }))}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Title</label>
                    <input
                      type="text"
                      value={state.hunter.title}
                      onChange={(e) => setState((prev) => ({ ...prev, hunter: { ...prev.hunter, title: e.target.value } }))}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Upload ID Photo from Device</label>
                    <input type="file" accept="image/*" onChange={(e) => handlePhotoUpload(e, "hunter")} className="w-full text-xs" />
                  </div>
                </div>
                <button onClick={() => setShowIdModal(false)} style={getButtonStyle("primary")} className="w-full py-2 text-xs font-bold uppercase">
                  Save & Close
                </button>
              </div>
            </div>
          )}

          {/* GOOGLE ACCOUNT PRIVATE VAULT MODAL */}
          {showGoogleModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div style={getWindowStyle()} className="max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2" style={{ borderColor: `${palette.primary}44` }}>
                  <h3 className="text-lg font-black uppercase" style={{ color: palette.primary }}>GOOGLE ACCOUNT PRIVATE VAULT</h3>
                  <button onClick={() => setShowGoogleModal(false)}>✕</button>
                </div>
                <p className="text-xs opacity-80">
                  Bind your Google Account email to isolate and auto-save your Hunter progress in a dedicated encrypted vault slot.
                </p>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 font-bold">Google Email (@gmail.com)</label>
                    <input
                      type="email"
                      placeholder="hunter@gmail.com"
                      value={gEmail}
                      onChange={(e) => setGEmail(e.target.value)}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Hunter Display Name</label>
                    <input
                      type="text"
                      value={gName}
                      onChange={(e) => setGName(e.target.value)}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Optional Private Vault PIN</label>
                    <input
                      type="password"
                      placeholder="••••"
                      value={gPin}
                      onChange={(e) => setGPin(e.target.value)}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={bindGoogleVault} style={getButtonStyle("primary")} className="flex-1 py-2 text-xs font-bold uppercase">
                    Bind & Save Vault
                  </button>
                  <button onClick={restoreFromGoogleVault} style={getButtonStyle("secondary")} className="flex-1 py-2 text-xs font-bold uppercase">
                    Restore Vault
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
